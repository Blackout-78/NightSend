plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blackout.nightsend'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blackout.nightsend'
        minSdk 26
        targetSdk 34
        versionCode 8
        versionName '0.8'
        buildConfigField 'String', 'BUILD_NUMBER', '"' + (System.getenv('GITHUB_RUN_NUMBER') ?: 'dev') + '"'
        buildConfigField 'String', 'GIT_SHA', '"' + (System.getenv('GITHUB_SHA') ?: 'local').take(7) + '"'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'missing.jks')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias System.getenv('KEY_ALIAS')
            keyPassword System.getenv('KEYSTORE_PASSWORD')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // QR code reader (pure Java, runs offline on the phone; nothing is sent anywhere)
    implementation 'com.google.zxing:core:3.5.3'
}
