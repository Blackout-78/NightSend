name: Build APK and PC exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  crypto-selftest:
    permissions:
      contents: read
    # Compiles the PC crypto the same way the app does and runs a full encrypted handshake over loopback.
    # If this fails nothing is published, so the APK and the exe can never get out of step.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: PC crypto self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./pc/selftest.ps1

  linux-selftest:
    permissions:
      contents: read
    # Tests the Linux app: the QR picture, the encrypted handshake against the phone's REAL Secure.java, send / receive / reconnect.
    # If this fails nothing is published.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux self-test
        run: |
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r pc/linux/requirements.txt
          "$RUNNER_TEMP/venv/bin/python" -I pc/linux/selftest.py --require-java

  build:
    needs: [crypto-selftest, linux-selftest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py --allow-internet

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: '8.14.4'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NightSend.apk

      - name: Write what's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release-notes.sh '^(build-|v[0-9])' . > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NightSend 0.8 (build ${{ github.run_number }})
          body_path: release-body.md
          files: NightSend.apk

  pc-exe:
    needs: build   # one release at a time, so both files land on the same release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Stamp the build number
        shell: pwsh
        run: |
          $stamp = "build ${{ github.run_number }} - " + $env:GITHUB_SHA.Substring(0,7)
          (Get-Content pc/NightSend.ps1 -Raw).Replace('$BuildStamp = "build dev"', ('$BuildStamp = "' + $stamp + '"')) | Set-Content pc/NightSend.ps1 -NoNewline -Encoding UTF8
          if (-not (Select-String -Path pc/NightSend.ps1 -Pattern ('"' + $stamp + '"') -Quiet)) { throw "stamp not applied" }
      - name: Build NightSend.exe from pc/NightSend.ps1
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -inputFile pc/NightSend.ps1 -outputFile NightSend.exe -noConsole -STA -title "NightSend" -product "NightSend" -version "2.0.0.0"
          if (-not (Test-Path NightSend.exe)) { throw "exe not built" }

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NightSend 0.8 (build ${{ github.run_number }})
          files: NightSend.exe

  linux-binary:
    needs: pc-exe   # one release at a time, so all files land on the same release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Stamp the build number
        run: |
          stamp="build ${{ github.run_number }} - ${GITHUB_SHA:0:7}"
          sed -i "s|^BUILD_STAMP = \"build dev\".*|BUILD_STAMP = \"$stamp\"|" pc/linux/nightsend.py
          grep -q "^BUILD_STAMP = \"$stamp\"" pc/linux/nightsend.py

      - name: Build NightSend for Linux (one file, nothing to install)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q python3-tk xvfb
          /usr/bin/python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q --require-hashes -r pc/linux/requirements.txt
          "$RUNNER_TEMP/venv/bin/pyinstaller" --onefile --noconfirm --name NightSend --distpath dist --workpath "$RUNNER_TEMP/pib" --specpath "$RUNNER_TEMP/pib" pc/linux/nightsend.py
          test -x dist/NightSend

      - name: Smoke test the built file (starts, shows its window, closes)
        run: |
          dist/NightSend --version
          xvfb-run -a dist/NightSend --smoke

      - name: Pack (keeps the run permission)
        run: tar -C dist -czf NightSend-linux-x86_64.tar.gz NightSend

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NightSend 0.8 (build ${{ github.run_number }})
          files: NightSend-linux-x86_64.tar.gz
