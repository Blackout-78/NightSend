name: Build APK and PC exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: {}

jobs:
  crypto-selftest:
    permissions:
      contents: read
    # Compiles the PC crypto the same way the app does and runs a full encrypted handshake over loopback.
    # If this fails nothing is published, so the APK and the exe can never get out of step.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - name: PC crypto self-test (Windows PowerShell 5.1)
        shell: powershell
        run: ./pc/selftest.ps1

  build:
    needs: crypto-selftest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Security guard (blocks the build if something dangerous was added)
        run: python3 .github/guard/guard.py --allow-internet

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a  # v4
        with:
          gradle-version: '8.14.4'

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          umask 077
          echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: gradle :app:assembleRelease --no-daemon

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk NightSend.apk

      - name: Write what's new
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release-notes.sh '^(build-|v[0-9])' . > release-body.md

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: build-${{ github.run_number }}
          name: NightSend 0.8 (build ${{ github.run_number }})
          body_path: release-body.md
          files: NightSend.apk

  pc-exe:
    needs: build   # one release at a time, so both files land on the same release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Stamp the build number
        shell: pwsh
        run: |
          $stamp = "build ${{ github.run_number }} - " + $env:GITHUB_SHA.Substring(0,7)
          (Get-Content pc/NightSend.ps1 -Raw).Replace('$BuildStamp = "build dev"', ('$BuildStamp = "' + $stamp + '"')) | Set-Content pc/NightSend.ps1 -NoNewline -Encoding UTF8
          if (-not (Select-String -Path pc/NightSend.ps1 -Pattern ('"' + $stamp + '"') -Quiet)) { throw "stamp not applied" }
      - name: Build NightSend.exe from pc/NightSend.ps1
        shell: pwsh
        run: |
          Install-Module ps2exe -Scope CurrentUser -Force
          Invoke-ps2exe -inputFile pc/NightSend.ps1 -outputFile NightSend.exe -noConsole -STA -title "NightSend" -product "NightSend" -version "2.0.0.0"
          if (-not (Test-Path NightSend.exe)) { throw "exe not built" }

      - name: Publish release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: build-${{ github.run_number }}
          name: NightSend 0.8 (build ${{ github.run_number }})
          files: NightSend.exe
